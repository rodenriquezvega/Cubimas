<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a1a2e">
<title>Inventario General 2026</title>
<link rel="manifest" id="manifest-placeholder">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f4f5;
  --surface:#fff;
  --border:#e4e4e7;
  --text:#18181b;
  --muted:#71717a;
  --accent:#2563eb;
  --accent-bg:#eff6ff;
  --accent-text:#1d4ed8;
  --green:#16a34a;
  --green-bg:#f0fdf4;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --yellow:#ca8a04;
  --yellow-bg:#fefce8;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:#1a1a2e;padding:16px 16px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
header h1{color:#fff;font-size:17px;font-weight:600;letter-spacing:-.3px}
header .sub{color:#a1a1aa;font-size:12px;font-weight:400;margin-left:4px}
.update-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.update-btn:active{background:rgba(255,255,255,.22)}
.update-btn svg{width:13px;height:13px;flex-shrink:0}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#71717a;pointer-events:none}
#search{width:100%;padding:10px 12px 10px 36px;border:none;border-radius:10px;font-size:15px;background:#fff;color:#18181b;outline:none;-webkit-appearance:none}
#search::placeholder{color:#a1a1aa}
.stats-bar{padding:8px 16px;font-size:12px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.stats-bar strong{color:var(--text)}
.last-update{font-size:10px;color:var(--muted);white-space:nowrap}
.list{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:14px;box-shadow:var(--shadow);transition:border-color .15s}
.card:active{border-color:var(--accent)}
.producto-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:10px}
.sucursales{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.suc{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.suc-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.suc-val{font-size:18px;font-weight:700;line-height:1}
.suc-val.zero{color:var(--muted);opacity:.5}
.suc-val.low{color:var(--yellow)}
.suc-val.ok{color:var(--green)}
.total-row{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.total-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.total-badge{background:var(--accent-bg);color:var(--accent-text);font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px}
.highlight{background:#fef9c3;border-radius:2px;padding:0 1px}
#install-btn{display:none;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;position:fixed;bottom:16px;right:16px;box-shadow:0 4px 12px rgba(37,99,235,.4);z-index:200}
.filter-row{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px;white-space:nowrap;cursor:pointer;transition:all .15s}
.chip.active{background:#1a1a2e;border-color:#1a1a2e;color:#fff}

/* Modal overlay */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal h2{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px}
.modal p{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
.drop-zone.dragover{border-color:var(--accent);background:var(--accent-bg)}
.drop-zone-icon{font-size:36px;margin-bottom:10px}
.drop-zone-text{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.drop-zone-sub{font-size:12px;color:var(--muted)}
.modal-cancel{width:100%;margin-top:14px;padding:12px;border:1.5px solid var(--border);border-radius:10px;background:none;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.modal-cancel:active{background:var(--bg)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#18181b;color:#fff;font-size:13px;font-weight:500;padding:10px 18px;border-radius:24px;z-index:400;transition:transform .3s ease;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red)}

/* Loading state */
.loading-bar{height:3px;background:var(--accent);position:fixed;top:0;left:0;z-index:500;animation:loadPulse 1s ease-in-out infinite;display:none}
.loading-bar.active{display:block}
@keyframes loadPulse{0%{width:0%;left:0}50%{width:70%;left:15%}100%{width:0%;left:100%}}
</style>
</head>

<header>

    <h1>Inventario 2026 <span class="sub">Electrodomésticos</span></h1>
    <button class="update-btn" id="open-modal-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Actualizar
    </button>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="search" placeholder="Buscar producto..." autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
</header>

<div class="filter-row" id="filter-row">
  <button class="chip active" data-filter="all">Todos</button>
  <button class="chip" data-filter="stock">Con Stock</button>
  <button class="chip" data-filter="torreon">Torreón</button>
  <button class="chip" data-filter="durango">Durango</button>
  <button class="chip" data-filter="mazatlan">Mazatlán</button>
  <button class="chip" data-filter="culiacan">Culiacán</button>
</div>

<div class="stats-bar" id="stats-bar"></div>
<div class="list" id="list"></div>
<button id="install-btn">&#43; Instalar App</button>

<!-- Modal actualizar -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Actualizar Inventario</h2>

    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-icon">📂</div>
      <div class="drop-zone-text">Toca para seleccionar archivo</div>
      <div class="drop-zone-sub">.xlsx — mismo formato que Inventario General 2026</div>
    </div>
    <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none">
    <button class="modal-cancel" id="modal-cancel">Cancelar</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

// ── Estado ────────────────────────────────────────────────────────────────────
let INVENTARIO = INVENTARIO_BASE.slice();
let query = '', filtro = 'all', debounce;
let lastUpdate = null;

// Intentar restaurar inventario guardado en localStorage
try {
  const saved = localStorage.getItem('inventario_data');
  const savedDate = localStorage.getItem('inventario_date');
  if (saved) {
    INVENTARIO = JSON.parse(saved);
    lastUpdate = savedDate;
  }
} catch(e) {}

// ── Helpers ───────────────────────────────────────────────────────────────────
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function stockColor(v) {
  if (v === 0) return 'zero';
  if (v <= 2) return 'low';
  return 'ok';
}

function highlight(text, q) {
  if (!q) return text;
  try {
    const re = new RegExp('(' + esc(q) + ')', 'gi');
    return text.replace(re, '<mark class="highlight">$1</mark>');
  } catch { return text; }
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function setLoading(on) {
  document.getElementById('loading-bar').className = 'loading-bar' + (on ? ' active' : '');
}

// ── Render ────────────────────────────────────────────────────────────────────
const listEl = document.getElementById('list');
const statsEl = document.getElementById('stats-bar');
const searchEl = document.getElementById('search');
const filterRow = document.getElementById('filter-row');

function render() {
  const q = norm(query);
  let results = INVENTARIO;

  if (q) {
    results = results.filter(p => norm(p.producto).includes(q));
  }
  if (filtro === 'stock') {
    results = results.filter(p => p.torreon + p.durango + p.mazatlan + p.culiacan > 0);
  } else if (filtro === 'torreon') {
    results = results.filter(p => p.torreon > 0);
  } else if (filtro === 'durango') {
    results = results.filter(p => p.durango > 0);
  } else if (filtro === 'mazatlan') {
    results = results.filter(p => p.mazatlan > 0);
  } else if (filtro === 'culiacan') {
    results = results.filter(p => p.culiacan > 0);
  }

  const countHtml = q || filtro !== 'all'
    ? `<strong>${results.length}</strong> de ${INVENTARIO.length} productos`
    : `<strong>${INVENTARIO.length}</strong> productos`;

  const dateHtml = lastUpdate
    ? `<span class="last-update">Actualizado: ${lastUpdate}</span>`
    : '';

  statsEl.innerHTML = `<span>${countHtml}</span>${dateHtml}`;

  if (!results.length) {
    listEl.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><p>Sin resultados para "<strong>${query}</strong>"</p></div>`;
    return;
  }

  const shown = results.slice(0, 80);
  listEl.innerHTML = shown.map(p => {
    const total = p.torreon + p.durango + p.mazatlan + p.culiacan;
    const nombre = highlight(p.producto, query);
    return `<div class="card">
      <div class="producto-name">${nombre}</div>
      <div class="sucursales">
        <div class="suc">
          <span class="suc-label">🏙 Torreón</span>
          <span class="suc-val ${stockColor(p.torreon)}">${p.torreon}</span>
        </div>
        <div class="suc">
          <span class="suc-label">🌵 Durango</span>
          <span class="suc-val ${stockColor(p.durango)}">${p.durango}</span>
        </div>
        <div class="suc">
          <span class="suc-label">🌊 Mazatlán</span>
          <span class="suc-val ${stockColor(p.mazatlan)}">${p.mazatlan}</span>
        </div>
        <div class="suc">
          <span class="suc-label">🌿 Culiacán</span>
          <span class="suc-val ${stockColor(p.culiacan)}">${p.culiacan}</span>
        </div>
      </div>
      ${total > 0 ? `<div class="total-row">
        <span class="total-label">Stock total</span>
        <span class="total-badge">${total} pzs</span>
      </div>` : ''}
    </div>`;
  }).join('');

  if (results.length > 80) {
    listEl.innerHTML += `<div class="stats-bar" style="text-align:center;padding:12px;border-radius:12px;margin-top:4px">Mostrando 80 de <strong>${results.length}</strong> resultados. Refina tu búsqueda.</div>`;
  }
}

// ── Búsqueda y filtros ────────────────────────────────────────────────────────
searchEl.addEventListener('input', e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { query = e.target.value.trim(); render(); }, 200);
});

filterRow.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  filterRow.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtro = btn.dataset.filter;
  render();
});

// ── Modal ─────────────────────────────────────────────────────────────────────
const modal = document.getElementById('modal-overlay');
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

document.getElementById('open-modal-btn').addEventListener('click', () => {
  modal.classList.add('open');
});

document.getElementById('modal-cancel').addEventListener('click', closeModal);

modal.addEventListener('click', e => {
  if (e.target === modal) closeModal();
});

function closeModal() {
  modal.classList.remove('open');
  fileInput.value = '';
}

dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
});

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) processFile(file);
});

// ── Procesar Excel ────────────────────────────────────────────────────────────
function processFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['xlsx', 'xls'].includes(ext)) {
    showToast('⚠️ Solo se aceptan archivos .xlsx o .xls', true);
    return;
  }

  closeModal();
  setLoading(true);

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });

      // Leer primera hoja
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: 0 });

      if (rows.length < 2) {
        throw new Error('El archivo está vacío o sin datos.');
      }

      // Detectar columnas por encabezado (flexible, sin mayúsculas/acentos)
      const headers = rows[0].map(h => norm(String(h || '')));

      const idxProd = headers.findIndex(h => h.includes('producto'));
      const idxTor  = headers.findIndex(h => h.includes('torreon') || h.includes('torr'));
      const idxDur  = headers.findIndex(h => h.includes('durango') || h.includes('dgo'));
      const idxMaz  = headers.findIndex(h => h.includes('mazatlan') || h.includes('maz'));
      const idxCul  = headers.findIndex(h => h.includes('culiacan') || h.includes('cul'));

      if (idxProd === -1) throw new Error('No se encontró la columna PRODUCTO.');
      if (idxTor === -1)  throw new Error('No se encontró la columna de Torreón.');
      if (idxDur === -1)  throw new Error('No se encontró la columna de Durango.');
      if (idxMaz === -1)  throw new Error('No se encontró la columna de Mazatlán.');
      if (idxCul === -1)  throw new Error('No se encontró la columna de Culiacán.');

      const newData = [];
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const prod = String(row[idxProd] || '').trim();
        if (!prod) continue;
        newData.push({
          producto: prod,
          torreon:  parseInt(row[idxTor]  || 0) || 0,
          durango:  parseInt(row[idxDur]  || 0) || 0,
          mazatlan: parseInt(row[idxMaz]  || 0) || 0,
          culiacan: parseInt(row[idxCul]  || 0) || 0,
        });
      }

      if (newData.length === 0) throw new Error('No se encontraron productos en el archivo.');

      // Actualizar inventario
      INVENTARIO = newData;
      const now = new Date();
      lastUpdate = now.toLocaleDateString('es-MX', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

      // Guardar en localStorage
      try {
        localStorage.setItem('inventario_data', JSON.stringify(INVENTARIO));
        localStorage.setItem('inventario_date', lastUpdate);
      } catch(e) { /* storage lleno, ignorar */ }

      setLoading(false);
      render();
      showToast(`✅ ${newData.length} productos cargados correctamente`);

    } catch (err) {
      setLoading(false);
      showToast('❌ ' + (err.message || 'Error al leer el archivo'), true);
    }
  };

  reader.onerror = () => {
    setLoading(false);
    showToast('❌ No se pudo leer el archivo', true);
  };

  reader.readAsArrayBuffer(file);
}

// ── PWA: Install ──────────────────────────────────────────────────────────────
let deferredPrompt;
const installBtn = document.getElementById('install-btn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', () => {
  installBtn.style.display = 'none';
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
});

// ── PWA: Service Worker ───────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const sw = `
const CACHE = 'inventario-v1';
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll([location.href])).then(() => self.skipWaiting()));
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))));
});
self.addEventListener('fetch', e => {
  e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
});
`;
  const blob = new Blob([sw], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}
