*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f4f5;
  --surface:#fff;
  --border:#e4e4e7;
  --text:#18181b;
  --muted:#71717a;
  --accent:#2563eb;
  --accent-bg:#eff6ff;
  --accent-text:#1d4ed8;
  --green:#16a34a;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:#1a1a2e;padding:16px 16px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
header h1{color:#fff;font-size:17px;font-weight:600;letter-spacing:-.3px;margin-bottom:10px}
header .sub{color:#a1a1aa;font-size:12px;font-weight:400;margin-left:4px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#71717a;pointer-events:none}
#search{width:100%;padding:10px 12px 10px 36px;border:none;border-radius:10px;font-size:15px;background:#fff;color:#18181b;outline:none;-webkit-appearance:none}
#search::placeholder{color:#a1a1aa}
.filters{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px;white-space:nowrap;cursor:pointer;transition:all .15s}
.chip.active{background:#1a1a2e;border-color:#1a1a2e;color:#fff}
.stats-bar{padding:8px 16px;font-size:12px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--border)}
.stats-bar strong{color:var(--text)}
.list{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:14px;box-shadow:var(--shadow);transition:border-color .15s}
.card:active{border-color:var(--accent)}
.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.marca-badge{font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap;background:var(--accent-bg);color:var(--accent-text);flex-shrink:0}
.producto-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.codigo{font-size:11px;color:var(--muted);font-family:monospace;margin-top:2px}
.prices{display:flex;flex-direction:column;gap:3px}
.precio-exhib{font-size:20px;font-weight:700;color:var(--green)}
.precio-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.precio-desc-row{display:flex;flex-direction:column;margin-top:6px}
.precio-desc{font-size:13px;font-weight:500;color:var(--text)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px}
.highlight{background:#fef9c3;border-radius:2px;padding:0 1px}
#install-btn{display:none;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;position:fixed;bottom:16px;right:16px;box-shadow:0 4px 12px rgba(37,99,235,.4);z-index:200}
</style>

const fmt = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2}).format(n);
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

let query = '', marcaActiva = '', debounce;

const marcas = [...new Set(PRODUCTOS.map(p => p.marca))].sort();
const filtersEl = document.getElementById('filters');
const listEl = document.getElementById('list');
const statsEl = document.getElementById('stats-bar');
const searchEl = document.getElementById('search');

marcas.forEach(m => {
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.textContent = m;
  btn.dataset.marca = m;
  filtersEl.appendChild(btn);
});

filtersEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if(!btn) return;
  marcaActiva = btn.dataset.marca;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.marca === marcaActiva));
  render();
});

searchEl.addEventListener('input', e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { query = e.target.value.trim(); render(); }, 120);
});

function highlight(text, q) {
  if(!q) return text;
  const re = new RegExp('(' + esc(norm(q)) + ')', 'gi');
  return text.replace(re, '<mark class="highlight">$1</mark>');
}

function render() {
  const q = norm(query);
  const filtered = PRODUCTOS.filter(p => {
    const matchMarca = !marcaActiva || p.marca === marcaActiva;
    if(!matchMarca) return false;
    if(!q) return true;
    return norm(p.codigo).includes(q) || norm(p.producto).includes(q) || norm(p.marca).includes(q);
  });

  const total = filtered.length;
  statsEl.innerHTML = query || marcaActiva
    ? `<strong>${total}</strong> resultado${total!==1?'s':''} encontrado${total!==1?'s':''}`
    : `<strong>${PRODUCTOS.length}</strong> productos en catálogo`;

  if(total === 0) {
    listEl.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Sin resultados para <strong>"${query}"</strong></p><p style="margin-top:6px;font-size:12px">Prueba con otro nombre o código</p></div>`;
    return;
  }

  const MAX = 80;
  const show = filtered.slice(0, MAX);

  listEl.innerHTML = show.map(p => `
    <div class="card">
      <div class="card-top">
        <span class="marca-badge">${p.marca}</span>
        <div>
          <div class="producto-name">${highlight(p.producto, query)}</div>
          <div class="codigo">${highlight(p.codigo, query)}</div>
        </div>
      </div>
      <div class="prices">
        <div>
          <div class="precio-label">Precio exhibición</div>
          <div class="precio-exhib">${fmt(p.precio_exhibicion)}</div>
        </div>
        <div class="precio-desc-row">
          <div class="precio-label">Precio con descuento</div>
          <div class="precio-desc">${fmt(p.precio_descuento)}</div>
        </div>
      </div>
    </div>
  `).join('');

  if(total > MAX) {
    listEl.innerHTML += `<p style="text-align:center;color:var(--muted);font-size:13px;padding:12px">Mostrando ${MAX} de ${total} — afina la búsqueda para ver más</p>`;
  }
}

render();

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').style.display = 'block';
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-btn').style.display = 'none';
});

const swCode = `
const CACHE = 'precios-v3';
self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/']))));
self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('/')))));
`;
if('serviceWorker' in navigator) {
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob), {scope:'/'}).catch(()=>{});
}
